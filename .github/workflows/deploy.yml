name: Deploy Quartz site to GitHub Pages

on:
  # 只保留手动触发：push 不再自动上线，避免「写入即发布」无审核闸门
  # 需要发布时到 Actions 页面点 Run workflow
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      # 1. 检出本仓库（纯内容 + 发布配置）
      #    fetch-depth: 0 —— Quartz 用 git 历史计算「最后更新时间」
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # 2. 按固定版本拉取 Quartz 引擎（引擎源码不入本仓库）
      #    升级引擎 = 改这一行 commit。当初内置副本就是上游 v4 分支的这个提交（已逐字节核对）
      - name: Checkout Quartz engine (pinned)
        uses: actions/checkout@v4
        with:
          repository: jackyzha0/quartz
          ref: d25a6eabf96751ffca56f8a8139272def7a65041
          path: engine

      # 3. 装配：站点配置放进引擎根；内容只拷 01-公开区（发布边界 = 目录隔离）
      - name: Assemble
        run: |
          cp publish/quartz.config.ts publish/quartz.layout.ts engine/
          mkdir -p engine/content
          rsync -a --exclude='.obsidian/' --exclude='.claudian/' --exclude='.DS_Store' 01-公开区/ engine/content/

      # 4. 守门：内容为空就拒绝构建（防止静默产出空站点——Quartz 对空 content 不报错）
      - name: Guard content not empty
        run: |
          count=$(find engine/content -name '*.md' | wc -l)
          echo "engine/content markdown files: $count"
          if [ "$count" -lt 1 ]; then
            echo "::error::engine/content 为空——01-公开区 没有被装配进去，拒绝构建"
            exit 1
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Dependencies
        working-directory: engine
        run: npm ci

      - name: Build Quartz
        working-directory: engine
        # 内容目录 = 引擎默认的 content/，无需 -d；不再存在「忘传 -d 出空站」的坑
        run: npx quartz build

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: engine/public

  deploy:
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
